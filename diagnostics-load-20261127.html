<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Temporary landing page load check</title>
<style>body{font:16px system-ui;max-width:1000px;margin:30px auto;padding:20px}button{padding:12px;font:inherit}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef3ef;padding:18px}</style>
<h1>Landing page load check</h1>
<p>Read-only HTTP test. Two rounds at 5, 10 and 20 concurrent visitors. Each visitor downloads the landing HTML and reads the Firebase counter summary. Counter writes and game scripts are excluded.</p>
<button id="run">Run bounded test</button><p id="status">Ready</p><pre id="results"></pre>
<script>
const firebaseUrl = 'https://belanjawan-2027-games-default-rtdb.asia-southeast1.firebasedatabase.app/counters.json';
const runButton = document.getElementById('run');
const statusLabel = document.getElementById('status');
const resultsElement = document.getElementById('results');
let halt = false;
function percentile(values, proportion) {
  if (!values.length) return null;
  const ordered = [...values].sort((a, b) => a - b);
  return Math.round(ordered[Math.max(0, Math.ceil(ordered.length * proportion) - 1)]);
}
async function request(kind) {
  const start = performance.now();
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 12000);
  try {
    const response = await fetch(kind === 'landing' ? './landing.html' : firebaseUrl, {cache: 'no-store', signal: controller.signal});
    const body = await response.text();
    const valid = response.ok && (kind === 'landing' ? body.includes('Jom Kenali Belanjawan 2027') && body.includes('Teka Cari Kata') : body.startsWith('{') && typeof JSON.parse(body) === 'object');
    if (!valid) halt = true;
    return {kind, status: response.status, ok: valid, ms: Math.round(performance.now() - start), bytes: new TextEncoder().encode(body).length};
  } catch (error) {
    halt = true;
    return {kind, status: 0, ok: false, ms: Math.round(performance.now() - start), error: error.message};
  } finally {clearTimeout(timeout);}
}
function summarize(kind, records) {
  const samples = records.filter(record => record.kind === kind);
  const durations = samples.filter(record => record.ok).map(record => record.ms);
  return {requests: samples.length, successful: durations.length, failed: samples.length - durations.length, medianMs: percentile(durations, .5), p95Ms: percentile(durations, .95), maxMs: durations.length ? Math.max(...durations) : null, statuses: samples.reduce((counts, sample) => {counts[sample.status] = (counts[sample.status] || 0) + 1; return counts;}, {})};
}
runButton.onclick = async () => {
  runButton.disabled = true;
  const report = {startedAt: new Date().toISOString(), method: 'One browser, read-only fetch requests, no browser HTTP cache, CDN cache uncontrolled, two bursts per stage, 12-second timeout, stop on failed requests', stages: [], records: []};
  statusLabel.textContent = 'Checking both endpoints';
  for (const kind of ['landing', 'counter']) report.records.push({...await request(kind), stage: 0});
  if (!halt) {
    for (const concurrency of [5, 10, 20]) {
      const stageStart = performance.now();
      const records = [];
      for (let round = 1; round <= 2; round++) {
        statusLabel.textContent = 'Testing ' + concurrency + ' concurrent visitors, round ' + round;
        const visitors = await Promise.all(Array.from({length: concurrency}, async (_, visitor) => {
          const page = await request('landing');
          const counter = halt ? [] : [await request('counter')];
          return [page, ...counter].map(record => ({...record, stage: concurrency, round, visitor}));
        }));
        records.push(...visitors.flat());
        if (halt) break;
        await new Promise(resolve => setTimeout(resolve, 1000));
      }
      report.records.push(...records);
      report.stages.push({concurrency, elapsedMs: Math.round(performance.now() - stageStart), landing: summarize('landing', records), counter: summarize('counter', records)});
      resultsElement.textContent = JSON.stringify(report, null, 2);
      if (halt) break;
      await new Promise(resolve => setTimeout(resolve, 2000));
    }
  }
  report.finishedAt = new Date().toISOString();
  report.haltedEarly = halt;
  resultsElement.textContent = JSON.stringify(report, null, 2);
  statusLabel.textContent = halt ? 'Stopped after an unsuccessful request' : 'Completed';
};
</script></html>
